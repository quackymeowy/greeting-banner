<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greeting Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  /*
    Greeting banner for Notion embeds.
    Sizes are tied to the iframe's own width/height (vw / vh), so the text
    always fits whatever size the embed block is dragged to in Notion.
  */
  :root {
    --ivory: #fffaf2;
    --gold: #c9973f;
    --ink: #2b211a;
    --sand: #d9c6a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }

  .banner {
    position: relative;
    height: 100vh;
    width: 100vw;
    border-radius: 14px;
    overflow: hidden;
    background: var(--sand);          /* shown only until the photo loads */
  }
  .photo {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: var(--focus, 30% 50%);
    opacity: 0;
    transition: opacity .8s ease;
  }
  .photo.ready { opacity: 1; }

  /* Soft warm shade behind the greeting so white text reads on the light photo */
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(92,66,40,.50) 0%, rgba(92,66,40,.22) 38%, rgba(92,66,40,0) 62%);
  }

  /* ---------- Left: greeting block (bottom-left, as in the mockup) ---------- */
  .content {
    position: absolute;
    left: clamp(18px, 11vw, 240px);
    right: 26vw;
    bottom: clamp(10px, 9vh, 40px);
    display: flex; flex-direction: column;
    gap: min(2.2vh, 8px);
    color: var(--ivory);
    text-shadow: 0 1px 10px rgba(70,48,26,.45), 0 0 2px rgba(70,48,26,.35);
  }
  .meta {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(9px, min(1.05vw, 4.6vh), 14px);
    letter-spacing: .24em;
    text-transform: uppercase;
    display: flex; flex-wrap: wrap; align-items: center; gap: .3em .9em;
    opacity: .95;
  }
  .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ivory); opacity: .8; }

  .greeting {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(24px, min(4.6vw, 21vh), 72px);
    line-height: 1.02;
    letter-spacing: .005em;
    white-space: nowrap;
  }
  .tagline {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: clamp(9px, min(1.25vw, 5.4vh), 17px);
    letter-spacing: .26em;
    text-transform: uppercase;
  }

  /* ---------- Right: quote with gold rule (as in the mockup) ---------- */
  .quote {
    position: absolute;
    right: clamp(14px, 3.4vw, 70px);
    top: 50%; transform: translateY(-50%);
    width: 15.5vw; min-width: 150px;
    padding-left: clamp(14px, 2.6vw, 52px);
    border-left: 2px solid var(--gold);
    padding-top: min(6vh, 22px); padding-bottom: min(6vh, 22px);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(15px, min(2.3vw, 11vh), 40px);
    line-height: 1.3;
    color: var(--ink);
  }
  .quote span { display: block; }

  .fade { animation: fade .9s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .photo { transition: none; } }

  /* Medium widths (narrow Notion windows / tablets): quote goes away, greeting gets the room */
  @media (max-width: 820px) {
    .quote { display: none; }
    .content { right: 18px; left: clamp(18px, 6vw, 60px); }
    .greeting { font-size: clamp(24px, min(6.4vw, 21vh), 52px); }
    .meta { font-size: clamp(9px, min(1.7vw, 4.6vh), 13px); }
    .tagline { font-size: clamp(9px, min(1.9vw, 5.4vh), 14px); }
  }
  /* Phones: keep the candle side of the photo, greeting along the bottom */
  @media (max-width: 560px) {
    .photo { background-position: 3% 50%; }
    .content { left: 16px; right: 16px; bottom: clamp(8px, 7vh, 18px); gap: min(2.4vh, 6px); }
    .shade { background: linear-gradient(0deg, rgba(92,66,40,.72) 0%, rgba(92,66,40,.45) 40%, rgba(92,66,40,0) 72%); }
    .greeting { font-size: clamp(22px, min(8.6vw, 18vh), 40px); }
    .meta { font-size: clamp(9px, 2.6vw, 12px); letter-spacing: .16em; }
    .tagline { font-size: clamp(9px, 2.7vw, 12px); letter-spacing: .18em; line-height: 1.5; }
  }
  /* Short embeds: drop secondary lines before anything gets cut off */
  @media (max-height: 130px) { .tagline { display: none; } .quote { font-size: 13px; line-height: 1.15; padding-top: 2px; padding-bottom: 2px; } }
  @media (max-height: 90px)  { .meta, .quote { display: none; } }
</style>
</head>
<body>
  <main class="banner" role="banner">
    <div class="photo" id="photo"></div>
    <div class="shade"></div>

    <div class="content fade">
      <div class="meta">
        <span id="date"></span>
        <span class="dot" aria-hidden="true"></span>
        <span id="time"></span>
      </div>
      <h1 class="greeting" id="greeting">Welcome, Enyita</h1>
      <p class="tagline" id="tagline"></p>
    </div>

    <blockquote class="quote fade" id="quote"></blockquote>
  </main>

<script>
(function () {
  /*
    Settings — every value can be overridden with a URL parameter, e.g.
    index.html?name=Enyita&tz=America/Los_Angeles&tagline=Line%20one|Line%20two&quote=Dream%20it.|Believe%20it.|Do%20it.
  */
  var DEFAULTS = {
    name: "Enyita",
    tz: "America/Los_Angeles",
    bg: "bg.jpg",
    focus: "30% 50%",                 // which part of the photo stays visible when cropped
    emoji: "",                        // e.g. "🙂" to show after the name
    taglines: ["Discipline today, freedom tomorrow."],   // several = one per day, rotating
    quote: ["Dream it.", "Believe it.", "Do it."]        // one entry per line
  };

  var p = new URLSearchParams(location.search);
  var name = p.get("name") || DEFAULTS.name;
  var tz = p.get("tz") || DEFAULTS.tz;
  var bg = p.get("bg") || DEFAULTS.bg;
  var focus = p.get("focus") || DEFAULTS.focus;
  var emoji = p.has("emoji") ? p.get("emoji") : DEFAULTS.emoji;
  var taglines = p.get("tagline") ? p.get("tagline").split("|") : DEFAULTS.taglines;
  var quote = p.has("quote") ? p.get("quote").split("|").filter(Boolean) : DEFAULTS.quote;

  try { new Date().toLocaleString("en-US", { timeZone: tz }); } catch (e) { tz = DEFAULTS.tz; }

  // Photo fades in once loaded
  var photo = document.getElementById("photo");
  photo.style.setProperty("--focus", focus);
  var img = new Image();
  img.onload = function () {
    photo.style.backgroundImage = 'url("' + bg.replace(/"/g, "%22") + '")';
    photo.classList.add("ready");
  };
  img.src = bg;

  // Static quote on the right
  var q = document.getElementById("quote");
  if (quote.length) {
    quote.forEach(function (line) {
      var s = document.createElement("span"); s.textContent = line; q.appendChild(s);
    });
  } else { q.style.display = "none"; }

  // Uses Date.toLocale* (not Intl.DateTimeFormat directly), which is more robust against
  // browser extensions that override the page's time zone.
  function parts(date) {
    var ymd = date.toLocaleDateString("en-CA", { timeZone: tz }).split("-");
    var hour = parseInt(date.toLocaleString("en-US", { timeZone: tz, hour: "numeric", hourCycle: "h23" }), 10);
    return { year: ymd[0], month: ymd[1], day: ymd[2], hour: hour };
  }
  function greetingFor(hour) {
    if (hour >= 5 && hour < 12) return "Good morning";
    if (hour >= 12 && hour < 17) return "Good afternoon";
    return "Good evening";
  }

  var el = {
    greeting: document.getElementById("greeting"),
    date: document.getElementById("date"),
    time: document.getElementById("time"),
    tagline: document.getElementById("tagline")
  };

  function render() {
    var now = new Date();
    var pt = parts(now);
    var hour = pt.hour % 24;

    el.greeting.textContent = greetingFor(hour) + ", " + name + (emoji ? " " + emoji : "");
    el.date.textContent = now.toLocaleDateString("en-US", {
      timeZone: tz, weekday: "long", month: "long", day: "numeric"
    });
    el.time.textContent = now.toLocaleTimeString("en-US", {
      timeZone: tz, hour: "numeric", minute: "2-digit"
    });

    var dayNumber = Math.floor(Date.UTC(+pt.year, +pt.month - 1, +pt.day) / 86400000);
    el.tagline.textContent = taglines[dayNumber % taglines.length];
  }

  render();
  setTimeout(function () { render(); setInterval(render, 60000); }, 60000 - (Date.now() % 60000) + 50);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
